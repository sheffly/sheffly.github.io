title: let my heart be still a moment/and this mystery explore
description: cacaw, or something
author: anonymous (unless u know me)

theme: minima

markdown: kramdown
permalink: /:year/:month/:day/:title/

plugins:
  # jekyll-feed removed on purpose: feed.xml is hand-rolled now so it can carry
  # the xml-stylesheet line that makes the feed render in the site's colors.
  - jekyll-sitemap
  - jekyll-seo-tag

# needs the scheme: absolute_url (used by the giscus theme + rss feed) builds on this
url: "https://sheffly.github.io"
baseurl: ""

# single source of truth for the ipod widget + the profile module's "now playing" row
now_playing:
  title: "brand new chanel$"
  artist: "Slayyyter"
  audio: "/assets/audio/brand-new-chanels.mp3"
  image: "/assets/images/album-brand-new-chanels.png"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
