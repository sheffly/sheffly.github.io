
<div id="ms-window-data" hidden>
  {% for post in site.posts %}
  <template class="ms-window-src"
            data-window-id="post-{{ post.url | slugify }}"
            data-window-title="{{ post.title | escape }}"
            data-window-date="{{ post.date | date: '%b %-d, %Y' }}"
            data-window-url="{{ post.url | relative_url }}">{{ post.content }}</template>
  {% endfor %}
</div>

<div id="ms-window-layer" aria-live="polite"></div>
