<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/punk.css' | relative_url }}">
  <!-- pink pixel heart favicon, same shape as the tiled background hearts -->
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="alternate icon" href="{{ '/assets/images/favicon.png' | relative_url }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/assets/images/favicon-512.png' | relative_url }}">
  {% feed_meta %}
</head>
